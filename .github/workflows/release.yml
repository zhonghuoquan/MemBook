name: Release

# 触发方式：
# 1) 推送 v 开头的 tag（如 git tag v1.0.0 && git push --tags）→ 构建并发布 GitHub Release
# 2) 手动触发（Actions 页面 → Run workflow）→ 仅构建并上传 Artifact，不发布
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  # ================= Windows 构建（NSIS 安装包） =================
  build-windows:
    name: Build Windows (NSIS)
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install dependencies
        run: npm ci

      - name: Normalize signing key
        shell: pwsh
        env:
          RAW_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: |
          $clean = ($env:RAW_KEY -replace '[\s\r\n]+', '').Trim()
          if ([string]::IsNullOrEmpty($clean)) {
            throw 'TAURI_SIGNING_PRIVATE_KEY 为空！请在仓库 Settings → Secrets and variables → Actions 中配置该密钥。'
          }
          if (-not $clean.StartsWith('dW50cnVzdGVk')) {
            throw "密钥格式错误：应以 dW50cnVzdGVk 开头（rsign 加密格式），实际开头为 '$($clean.Substring(0,[Math]::Min(20,$clean.Length)))'。请从本地 .tauri\membook-updater.key 重新复制粘贴。"
          }
          Add-Content -Path $env:GITHUB_ENV -Value "TAURI_SIGNING_PRIVATE_KEY=$clean" -Encoding utf8
          Write-Host "签名密钥已清洗：长度 $($clean.Length) 字符"

      - name: Build Tauri app (NSIS)
        run: npx tauri build --bundles nsis

      - name: Generate update manifest (Windows)
        shell: pwsh
        env:
          CNB_RELEASE_REPO: ${{ secrets.CNB_RELEASE_REPO }}
        run: |
          $tag = "${{ github.ref_name }}"
          $ver = $tag.TrimStart('v')
          $repo = $env:GITHUB_REPOSITORY
          # 通过 glob 匹配真实的安装包签名文件，避免硬编码文件名与实际产物命名偏差
          $sigFile = Get-ChildItem "src-tauri/target/release/bundle/nsis/*.exe.sig" | Select-Object -First 1
          if (-not $sigFile) {
            $names = (Get-ChildItem "src-tauri/target/release/bundle/nsis" -ErrorAction SilentlyContinue | Select-Object -ExpandProperty Name) -join "`n"
            throw "找不到 Windows updater 签名文件('*.exe.sig')，请确认已配置 TAURI_SIGNING_PRIVATE_KEY。nsis 目录内容：`n$names"
          }
          $sig = (Get-Content $sigFile.FullName -Raw).Trim()
          $baseName = $sigFile.FullName -replace '\.sig$',''
          $exe = [System.IO.Path]::GetFileName($baseName)
          $url = "https://github.com/${repo}/releases/download/${tag}/${exe}"
          $pub = (Get-Date).ToUniversalTime().ToString("yyyy-MM-ddTHH:mm:ssZ")
          $manifest = [ordered]@{
            version  = $ver
            pub_date = $pub
            notes    = ""
            platforms = [ordered]@{
              "windows-x86_64" = [ordered]@{ signature = $sig; url = $url }
            }
          }
          $json = $manifest | ConvertTo-Json -Depth 6
          Set-Content -Path "update-windows-x86_64.json" -Value $json -Encoding utf8
          # 生成 cnb 版清单（url 指向 cnb 下载地址，用于国内加速；仅当配置了 CNB_RELEASE_REPO 时）
          if ($env:CNB_RELEASE_REPO) {
            $cnbUrl = "https://cnb.cool/$($env:CNB_RELEASE_REPO)/-/releases/download/latest/${exe}"
            $cnbManifest = [ordered]@{
              version  = $ver
              pub_date = $pub
              notes    = ""
              platforms = [ordered]@{
                "windows-x86_64" = [ordered]@{ signature = $sig; url = $cnbUrl }
              }
            }
            $cnbJson = $cnbManifest | ConvertTo-Json -Depth 6
            Set-Content -Path "update-cnb-windows-x86_64.json" -Value $cnbJson -Encoding utf8
            Write-Host "已生成 cnb 版清单: update-cnb-windows-x86_64.json (url=$cnbUrl)"
          }

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v4
        with:
          name: membook-windows
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/nsis/*.sig
            update-windows-x86_64.json
          if-no-files-found: warn

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          files: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/nsis/*.sig
            update-windows-x86_64.json

      - name: Sync to CNB Release (Windows)
        if: startsWith(github.ref, 'refs/tags/') && env.CNB_TOKEN != ''
        env:
          CNB_TOKEN: ${{ secrets.CNB_TOKEN }}
          CNB_REPO: ${{ secrets.CNB_RELEASE_REPO }}
          CNB_TAG: ${{ github.ref_name }}
          CNB_RELEASE_REPO: ${{ secrets.CNB_RELEASE_REPO }}
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $token = $env:CNB_TOKEN
          $repo = $env:CNB_REPO
          $tag = $env:CNB_TAG
          if ([string]::IsNullOrEmpty($token)) { Write-Host "未配置 CNB_TOKEN，跳过"; exit 0 }
          if ([string]::IsNullOrEmpty($repo)) { Write-Host "未配置 CNB_RELEASE_REPO，跳过"; exit 0 }
          $base = "https://api.cnb.cool"
          $headers = @{ Authorization = "Bearer $token"; Accept = "application/json" }

          # 1) 使用固定的 "latest" 标签 Release（覆盖更新），确保所有旧版本用户都能命中 cnb 端点
          $latestTag = "latest"
          try {
            $existing = Invoke-RestMethod -Uri "$base/$repo/-/releases/tags/$latestTag" -Headers $headers -TimeoutSec 20
            Write-Host "cnb latest Release 已存在: $($existing.id)"
            $release = $existing
          } catch {
            $body = @{
              tag_name         = $latestTag
              target_commitish = "main"
              name             = "latest"
              description      = "MemBook 最新安装包（同步自 GitHub Actions $tag）"
            } | ConvertTo-Json
            $release = Invoke-RestMethod -Method Post -Uri "$base/$repo/-/releases" -Headers $headers -Body $body -ContentType "application/json" -TimeoutSec 20
            Write-Host "已创建 cnb latest Release: $($release.id)"
          }

          # 2) 上传附件（exe + sig + GitHub 版清单 + cnb 版清单）
          $files = @(
            (Get-ChildItem "src-tauri/target/release/bundle/nsis/*.exe" | Select-Object -First 1),
            (Get-ChildItem "src-tauri/target/release/bundle/nsis/*.exe.sig" | Select-Object -First 1),
            (Get-Item "update-windows-x86_64.json"),
            (Get-Item "update-cnb-windows-x86_64.json")
          )
          foreach ($f in $files) {
            if (-not $f) { Write-Host "跳过缺失文件"; continue }
            $fileName = $f.Name
            # a) 获取预签名上传 URL + verify_url
            $upBody = @{ asset_name = $fileName; size = $f.Length; overwrite = $true } | ConvertTo-Json
            $uploadInfo = Invoke-RestMethod -Method Post -Uri "$base/$repo/-/releases/$($release.id)/asset-upload-url" -Headers $headers -Body $upBody -ContentType "application/json" -TimeoutSec 30
            Write-Host "获取上传地址: $fileName"
            # b) 将文件 PUT 到预签名地址
            Invoke-WebRequest -Method Put -Uri $uploadInfo.upload_url -InFile $f.FullName -UseBasicParsing -TimeoutSec 300 | Out-Null
            # c) 调用确认接口完成上传
            try {
              Invoke-RestMethod -Method Post -Uri $uploadInfo.verify_url -Headers $headers -ContentType "application/json" -TimeoutSec 30 | Out-Null
              Write-Host "已上传并确认: $fileName"
            } catch {
              Write-Host "确认接口调用失败（不影响已上传文件）: $($_.Exception.Message)"
            }
          }
          Write-Host "cnb 同步完成（Windows）"

  # ================= macOS 构建（Universal DMG，Intel + Apple Silicon） =================
  build-macos:
    name: Build macOS (Universal DMG)
    runs-on: macos-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Setup Rust (universal targets)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install dependencies
        run: npm ci

      - name: Normalize signing key
        shell: pwsh
        env:
          RAW_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: |
          $clean = ($env:RAW_KEY -replace '[\s\r\n]+', '').Trim()
          if ([string]::IsNullOrEmpty($clean)) {
            throw 'TAURI_SIGNING_PRIVATE_KEY 为空！请在仓库 Settings → Secrets and variables → Actions 中配置该密钥。'
          }
          if (-not $clean.StartsWith('dW50cnVzdGVk')) {
            throw "密钥格式错误：应以 dW50cnVzdGVk 开头（rsign 加密格式），实际开头为 '$($clean.Substring(0,[Math]::Min(20,$clean.Length)))'。请从本地 .tauri\membook-updater.key 重新复制粘贴。"
          }
          Add-Content -Path $env:GITHUB_ENV -Value "TAURI_SIGNING_PRIVATE_KEY=$clean" -Encoding utf8
          Write-Host "签名密钥已清洗：长度 $($clean.Length) 字符"

      - name: Build Tauri app (universal DMG)
        run: npx tauri build --bundles app,dmg --target universal-apple-darwin

      - name: Generate update manifest (macOS)
        shell: pwsh
        env:
          CNB_RELEASE_REPO: ${{ secrets.CNB_RELEASE_REPO }}
        run: |
          $tag = "${{ github.ref_name }}"
          $ver = $tag.TrimStart('v')
          $repo = $env:GITHUB_REPOSITORY
          # macOS 的 updater 产物是 bundle/macos/*.app.tar.gz（含其 .sig），DMG 不是更新产物、无签名
          $sigFile = Get-ChildItem "src-tauri/target/universal-apple-darwin/release/bundle/macos/*.app.tar.gz.sig" | Select-Object -First 1
          if (-not $sigFile) { throw "找不到 macOS updater 签名文件('.app.tar.gz.sig')，请确认 bundle.createUpdaterArtifacts 已开启" }
          $sig = (Get-Content $sigFile.FullName -Raw).Trim()
          $baseName = $sigFile.FullName -replace '\.sig$',''
          $artifact = [System.IO.Path]::GetFileName($baseName)
          $url = "https://github.com/${repo}/releases/download/${tag}/${artifact}"
          $pub = (Get-Date).ToUniversalTime().ToString("yyyy-MM-ddTHH:mm:ssZ")
          $manifest = [ordered]@{
            version   = $ver
            pub_date  = $pub
            notes     = ""
            platforms = [ordered]@{
              "darwin-universal" = [ordered]@{ signature = $sig; url = $url }
            }
          }
          $json = $manifest | ConvertTo-Json -Depth 6
          Set-Content -Path "update-darwin-universal.json" -Value $json -Encoding utf8
          # 生成 cnb 版清单（url 指向 cnb 下载地址，用于国内加速；仅当配置了 CNB_RELEASE_REPO 时）
          if ($env:CNB_RELEASE_REPO) {
            $cnbUrl = "https://cnb.cool/$($env:CNB_RELEASE_REPO)/-/releases/download/latest/${artifact}"
            $cnbManifest = [ordered]@{
              version   = $ver
              pub_date  = $pub
              notes     = ""
              platforms = [ordered]@{
                "darwin-universal" = [ordered]@{ signature = $sig; url = $cnbUrl }
              }
            }
            $cnbJson = $cnbManifest | ConvertTo-Json -Depth 6
            Set-Content -Path "update-cnb-darwin-universal.json" -Value $cnbJson -Encoding utf8
            Write-Host "已生成 cnb 版清单: update-cnb-darwin-universal.json (url=$cnbUrl)"
          }

      - name: Upload macOS artifacts
        uses: actions/upload-artifact@v4
        with:
          name: membook-macos
          path: |
            src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg
            src-tauri/target/universal-apple-darwin/release/bundle/macos/*.app.tar.gz
            src-tauri/target/universal-apple-darwin/release/bundle/macos/*.app.tar.gz.sig
            update-darwin-universal.json
          if-no-files-found: warn

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          files: |
            src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg
            src-tauri/target/universal-apple-darwin/release/bundle/macos/*.app.tar.gz
            src-tauri/target/universal-apple-darwin/release/bundle/macos/*.app.tar.gz.sig
            update-darwin-universal.json

      - name: Sync to CNB Release (macOS)
        if: startsWith(github.ref, 'refs/tags/') && env.CNB_TOKEN != ''
        env:
          CNB_TOKEN: ${{ secrets.CNB_TOKEN }}
          CNB_REPO: ${{ secrets.CNB_RELEASE_REPO }}
          CNB_TAG: ${{ github.ref_name }}
          CNB_RELEASE_REPO: ${{ secrets.CNB_RELEASE_REPO }}
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $token = $env:CNB_TOKEN
          $repo = $env:CNB_REPO
          $tag = $env:CNB_TAG
          if ([string]::IsNullOrEmpty($token)) { Write-Host "未配置 CNB_TOKEN，跳过"; exit 0 }
          if ([string]::IsNullOrEmpty($repo)) { Write-Host "未配置 CNB_RELEASE_REPO，跳过"; exit 0 }
          $base = "https://api.cnb.cool"
          $headers = @{ Authorization = "Bearer $token"; Accept = "application/json" }

          # 1) 使用固定的 "latest" 标签 Release（覆盖更新），确保所有旧版本用户都能命中 cnb 端点
          $latestTag = "latest"
          try {
            $existing = Invoke-RestMethod -Uri "$base/$repo/-/releases/tags/$latestTag" -Headers $headers -TimeoutSec 20
            Write-Host "cnb latest Release 已存在: $($existing.id)"
            $release = $existing
          } catch {
            $body = @{
              tag_name         = $latestTag
              target_commitish = "main"
              name             = "latest"
              description      = "MemBook 最新安装包（同步自 GitHub Actions $tag）"
            } | ConvertTo-Json
            $release = Invoke-RestMethod -Method Post -Uri "$base/$repo/-/releases" -Headers $headers -Body $body -ContentType "application/json" -TimeoutSec 20
            Write-Host "已创建 cnb latest Release: $($release.id)"
          }

          # 2) 上传附件（dmg + app.tar.gz + sig + GitHub 版清单 + cnb 版清单）
          $files = @(
            (Get-ChildItem "src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg" | Select-Object -First 1),
            (Get-ChildItem "src-tauri/target/universal-apple-darwin/release/bundle/macos/*.app.tar.gz" | Select-Object -First 1),
            (Get-ChildItem "src-tauri/target/universal-apple-darwin/release/bundle/macos/*.app.tar.gz.sig" | Select-Object -First 1),
            (Get-Item "update-darwin-universal.json"),
            (Get-Item "update-cnb-darwin-universal.json")
          )
          foreach ($f in $files) {
            if (-not $f) { Write-Host "跳过缺失文件"; continue }
            $fileName = $f.Name
            # a) 获取预签名上传 URL + verify_url
            $upBody = @{ asset_name = $fileName; size = $f.Length; overwrite = $true } | ConvertTo-Json
            $uploadInfo = Invoke-RestMethod -Method Post -Uri "$base/$repo/-/releases/$($release.id)/asset-upload-url" -Headers $headers -Body $upBody -ContentType "application/json" -TimeoutSec 30
            Write-Host "获取上传地址: $fileName"
            # b) 将文件 PUT 到预签名地址
            Invoke-WebRequest -Method Put -Uri $uploadInfo.upload_url -InFile $f.FullName -UseBasicParsing -TimeoutSec 600 | Out-Null
            # c) 调用确认接口完成上传
            try {
              Invoke-RestMethod -Method Post -Uri $uploadInfo.verify_url -Headers $headers -ContentType "application/json" -TimeoutSec 30 | Out-Null
              Write-Host "已上传并确认: $fileName"
            } catch {
              Write-Host "确认接口调用失败（不影响已上传文件）: $($_.Exception.Message)"
            }
          }
          Write-Host "cnb 同步完成（macOS）"
