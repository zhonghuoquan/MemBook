name: Release

# 触发方式：
# 1) 推送 v 开头的 tag（如 git tag v1.0.0 && git push --tags）→ 构建并发布 GitHub Release
# 2) 手动触发（Actions 页面 → Run workflow）→ 仅构建并上传 Artifact，不发布
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  # ================= Windows 构建（NSIS 安装包） =================
  build-windows:
    name: Build Windows (NSIS)
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install dependencies
        run: npm ci

      - name: Build Tauri app (NSIS)
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: npx tauri build --bundles nsis

      - name: Generate update manifest (Windows)
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}"
          $ver = $tag.TrimStart('v')
          $repo = $env:GITHUB_REPOSITORY
          $exe = "MemBook_${ver}_x64-setup.exe"
          $url = "https://github.com/${repo}/releases/download/${tag}/${exe}"
          $sig = (Get-Content "src-tauri/target/release/bundle/nsis/${exe}.sig" -Raw).Trim()
          $pub = (Get-Date).ToUniversalTime().ToString("yyyy-MM-ddTHH:mm:ssZ")
          $manifest = [ordered]@{
            version  = $ver
            pub_date = $pub
            notes    = ""
            platforms = [ordered]@{
              "windows-x86_64" = [ordered]@{ signature = $sig; url = $url }
            }
          }
          $json = $manifest | ConvertTo-Json -Depth 6
          Set-Content -Path "update-windows-x86_64.json" -Value $json -Encoding utf8

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v4
        with:
          name: membook-windows
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/nsis/*.sig
            update-windows-x86_64.json
          if-no-files-found: warn

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          files: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/nsis/*.sig
            update-windows-x86_64.json

  # ================= macOS 构建（Universal DMG，Intel + Apple Silicon） =================
  build-macos:
    name: Build macOS (Universal DMG)
    runs-on: macos-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Setup Rust (universal targets)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install dependencies
        run: npm ci

      - name: Build Tauri app (universal DMG)
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: npx tauri build --bundles app,dmg --target universal-apple-darwin

      - name: Generate update manifest (macOS)
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}"
          $ver = $tag.TrimStart('v')
          $repo = $env:GITHUB_REPOSITORY
          $dmg = "MemBook_${ver}_universal.dmg"
          $url = "https://github.com/${repo}/releases/download/${tag}/${dmg}"
          $sig = (Get-Content "src-tauri/target/universal-apple-darwin/release/bundle/dmg/${dmg}.sig" -Raw).Trim()
          $pub = (Get-Date).ToUniversalTime().ToString("yyyy-MM-ddTHH:mm:ssZ")
          $manifest = [ordered]@{
            version  = $ver
            pub_date = $pub
            notes    = ""
            platforms = [ordered]@{
              "darwin-universal" = [ordered]@{ signature = $sig; url = $url }
            }
          }
          $json = $manifest | ConvertTo-Json -Depth 6
          Set-Content -Path "update-darwin-universal.json" -Value $json -Encoding utf8

      - name: Upload macOS artifacts
        uses: actions/upload-artifact@v4
        with:
          name: membook-macos
          path: |
            src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg
            src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.sig
            update-darwin-universal.json
          if-no-files-found: warn

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          files: |
            src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg
            src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.sig
            update-darwin-universal.json
