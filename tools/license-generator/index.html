<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>MemBook 激活码生成器</title>
  <style>
    :root {
      --brand: #6C63FF;
      --brand-600: #5a52d5;
      --brand-light: #f0efff;
      --success: #10b981;
      --success-light: #ecfdf5;
      --error: #ef4444;
      --error-light: #fef2f2;
      --warning: #f59e0b;
      --warning-light: #fffbeb;
      --gray-25: #fcfcfd;
      --gray-50: #f9fafb;
      --gray-100: #f2f4f7;
      --gray-200: #eaecf0;
      --gray-300: #d0d5dd;
      --gray-400: #98a2b3;
      --gray-500: #667085;
      --gray-600: #475467;
      --gray-700: #344054;
      --gray-800: #1d2939;
      --gray-900: #101828;
      --radius-sm: 6px;
      --radius-md: 10px;
      --radius-lg: 14px;
      --radius-xl: 18px;
      --shadow-sm: 0 1px 2px rgba(16, 24, 40, 0.05);
      --shadow-md: 0 4px 12px rgba(16, 24, 40, 0.08);
      --shadow-lg: 0 12px 32px rgba(16, 24, 40, 0.12);
      --font-sans: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "PingFang SC", "Microsoft YaHei", sans-serif;
      --font-mono: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: var(--font-sans);
      background: linear-gradient(135deg, #f3f4ff 0%, #f9fafb 100%);
      color: var(--gray-800);
      min-height: 100vh;
      padding: 24px;
    }

    .container {
      max-width: 960px;
      margin: 0 auto;
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    header {
      text-align: center;
      padding: 24px 0 8px;
    }

    .logo {
      width: 48px;
      height: 48px;
      background: var(--brand);
      border-radius: var(--radius-lg);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      color: white;
      font-weight: 700;
      font-size: 20px;
      margin-bottom: 14px;
      box-shadow: 0 6px 16px rgba(108, 99, 255, 0.25);
    }

    h1 {
      margin: 0;
      font-size: 24px;
      font-weight: 700;
      color: var(--gray-900);
    }

    .subtitle {
      margin-top: 6px;
      font-size: 13px;
      color: var(--gray-500);
    }

    .card {
      background: white;
      border-radius: var(--radius-xl);
      box-shadow: var(--shadow-md);
      border: 1px solid var(--gray-200);
      overflow: hidden;
    }

    .card-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 16px 20px;
      border-bottom: 1px solid var(--gray-100);
      background: var(--gray-25);
    }

    .card-title {
      font-size: 15px;
      font-weight: 600;
      color: var(--gray-800);
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .card-title svg {
      width: 18px;
      height: 18px;
      color: var(--brand);
    }

    .card-body {
      padding: 20px;
    }

    .form-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
      gap: 16px;
    }

    .field {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .field label {
      font-size: 12px;
      font-weight: 600;
      color: var(--gray-600);
    }

    .field input,
    .field textarea,
    .field select {
      padding: 10px 12px;
      border: 1px solid var(--gray-300);
      border-radius: var(--radius-md);
      font-size: 13px;
      font-family: var(--font-sans);
      background: white;
      color: var(--gray-800);
      outline: none;
      transition: border-color 0.15s, box-shadow 0.15s;
    }

    .field input:focus,
    .field textarea:focus,
    .field select:focus {
      border-color: var(--brand);
      box-shadow: 0 0 0 3px rgba(108, 99, 255, 0.12);
    }

    .field input::placeholder,
    .field textarea::placeholder {
      color: var(--gray-400);
    }

    .field textarea {
      font-family: var(--font-mono);
      font-size: 11px;
      resize: vertical;
      min-height: 80px;
    }

    .hint {
      font-size: 11px;
      color: var(--gray-500);
      line-height: 1.5;
    }

    .button-row {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      margin-top: 16px;
    }

    button {
      border: none;
      outline: none;
      cursor: pointer;
      font-family: var(--font-sans);
      font-size: 13px;
      font-weight: 600;
      padding: 10px 16px;
      border-radius: var(--radius-md);
      transition: all 0.15s;
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }

    button:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    .btn-primary {
      background: var(--brand);
      color: white;
      box-shadow: 0 4px 12px rgba(108, 99, 255, 0.25);
    }

    .btn-primary:hover:not(:disabled) { background: var(--brand-600); }

    .btn-secondary {
      background: white;
      color: var(--gray-700);
      border: 1px solid var(--gray-300);
    }

    .btn-secondary:hover:not(:disabled) { background: var(--gray-50); }

    .btn-danger {
      background: var(--error);
      color: white;
    }

    .btn-danger:hover:not(:disabled) { background: #dc2626; }

    .badge {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      padding: 3px 8px;
      border-radius: 999px;
      font-size: 11px;
      font-weight: 600;
    }

    .badge-success { background: var(--success-light); color: var(--success); }
    .badge-warning { background: var(--warning-light); color: var(--warning); }
    .badge-error { background: var(--error-light); color: var(--error); }

    .key-status {
      display: flex;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
    }

    .key-thumb {
      font-family: var(--font-mono);
      font-size: 12px;
      color: var(--gray-500);
      background: var(--gray-100);
      padding: 4px 8px;
      border-radius: var(--radius-sm);
    }

    .results {
      margin-top: 16px;
    }

    .results-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 10px;
    }

    .results-count {
      font-size: 13px;
      color: var(--gray-600);
    }

    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 12px;
    }

    th, td {
      text-align: left;
      padding: 10px 12px;
      border-bottom: 1px solid var(--gray-100);
    }

    th {
      background: var(--gray-50);
      font-weight: 600;
      color: var(--gray-600);
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 0.3px;
    }

    td {
      color: var(--gray-700);
      vertical-align: top;
    }

    .mono {
      font-family: var(--font-mono);
      word-break: break-all;
    }

    .code-cell {
      font-family: var(--font-mono);
      font-weight: 600;
      color: var(--brand-600);
      white-space: nowrap;
    }

    .actions {
      display: flex;
      gap: 6px;
    }

    .icon-btn {
      padding: 6px;
      border-radius: var(--radius-sm);
      background: var(--gray-100);
      color: var(--gray-600);
      border: none;
      cursor: pointer;
    }

    .icon-btn:hover { background: var(--gray-200); color: var(--gray-800); }

    .icon-btn svg {
      width: 14px;
      height: 14px;
    }

    .empty {
      text-align: center;
      padding: 32px;
      color: var(--gray-500);
      font-size: 13px;
    }

    .alert {
      padding: 12px 14px;
      border-radius: var(--radius-md);
      font-size: 12px;
      line-height: 1.5;
      margin-top: 12px;
    }

    .alert-warning {
      background: var(--warning-light);
      color: #92400e;
      border: 1px solid #fde68a;
    }

    .alert-success {
      background: var(--success-light);
      color: #065f46;
      border: 1px solid #a7f3d0;
    }

    .tabs {
      display: flex;
      gap: 4px;
      padding: 4px;
      background: var(--gray-100);
      border-radius: var(--radius-md);
      width: fit-content;
    }

    .tab {
      padding: 6px 12px;
      border-radius: var(--radius-sm);
      font-size: 12px;
      font-weight: 600;
      color: var(--gray-600);
      cursor: pointer;
      border: none;
      background: transparent;
    }

    .tab.active {
      background: white;
      color: var(--gray-800);
      box-shadow: var(--shadow-sm);
    }

    .hidden { display: none !important; }

    .copy-toast {
      position: fixed;
      bottom: 24px;
      left: 50%;
      transform: translateX(-50%);
      background: var(--gray-800);
      color: white;
      padding: 10px 18px;
      border-radius: var(--radius-lg);
      font-size: 13px;
      font-weight: 500;
      box-shadow: var(--shadow-lg);
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.2s;
      z-index: 1000;
    }

    .copy-toast.show { opacity: 1; }

    footer {
      text-align: center;
      padding: 12px 0 24px;
      font-size: 11px;
      color: var(--gray-400);
    }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <div class="logo">M</div>
      <h1>MemBook 激活码生成器</h1>
      <div class="subtitle">离线 RSA 签名 · 可选机器码绑定 · 仅供授权管理员使用</div>
    </header>

    <!-- 密钥管理 -->
    <section class="card">
      <div class="card-header">
        <div class="card-title">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 2l-2 2m-7.61 7.61a5.5 5.5 0 1 1-7.778 7.778 5.5 5.5 0 0 1 7.777-7.777zm0 0L15.5 7.5m0 0l3 3L22 7l-3-3m-3.5 3.5L19 4"/></svg>
          密钥管理
        </div>
        <div class="key-status">
          <span id="keyStatusBadge" class="badge badge-warning">未加载密钥</span>
          <span id="keyThumb" class="key-thumb hidden">—</span>
        </div>
      </div>
      <div class="card-body">
        <div class="form-grid">
          <div class="field" style="grid-column: 1 / -1;">
            <label>公钥（可公开，需复制到 src/license/publicKey.ts）</label>
            <textarea id="publicKeyOut" readonly placeholder="点击生成密钥对…"></textarea>
          </div>
        </div>
        <div class="button-row">
          <button class="btn-primary" onclick="generateKeyPair()">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 2l-2 2m-7.61 7.61a5.5 5.5 0 1 1-7.778 7.778 5.5 5.5 0 0 1 7.777-7.777zm0 0L15.5 7.5m0 0l3 3L22 7l-3-3m-3.5 3.5L19 4"/></svg>
            生成新密钥对
          </button>
          <button class="btn-secondary" onclick="exportKeys()">导出密钥对(JSON)</button>
          <button class="btn-secondary" onclick="importKeys()">导入密钥对</button>
          <button class="btn-secondary" onclick="copyPublicKey()">复制公钥</button>
        </div>
        <div class="alert alert-warning">
          <strong>安全提示：</strong>私钥仅保存在当前页面与导出文件中，切勿将本工具或私钥文件随 MemBook 应用一起分发给终端用户。
        </div>
      </div>
    </section>

    <!-- 生成激活码 -->
    <section class="card">
      <div class="card-header">
        <div class="card-title">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
          生成激活码
        </div>
      </div>
      <div class="card-body">
        <div class="form-grid">
          <div class="field">
            <label>生成数量</label>
            <input id="batchCount" type="number" min="1" max="100" value="1" />
          </div>
          <div class="field">
            <label>机器码绑定（可选）</label>
            <input id="machineId" type="text" placeholder="留空则不绑定机器" />
            <span class="hint">输入用户激活弹窗中显示的机器标识，即可让激活码仅限该设备使用。</span>
          </div>
        </div>
        <div class="button-row">
          <button class="btn-primary" id="generateBtn" onclick="generateCodes()" disabled>
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/></svg>
            生成并签名
          </button>
          <button class="btn-secondary" onclick="exportResults('json')">导出 JSON</button>
          <button class="btn-secondary" onclick="exportResults('csv')">导出 CSV</button>
          <button class="btn-danger" onclick="clearResults()">清空结果</button>
        </div>

        <div class="results">
          <div class="results-header">
            <div class="results-count" id="resultsCount">共 0 条</div>
          </div>
          <div id="resultsTableWrapper">
            <table>
              <thead>
                <tr>
                  <th style="width: 220px;">激活码</th>
                  <th>签名</th>
                  <th style="width: 100px;">绑定机器</th>
                  <th style="width: 80px;">操作</th>
                </tr>
              </thead>
              <tbody id="resultsBody"></tbody>
            </table>
            <div class="empty" id="emptyState">暂无激活码，点击上方按钮生成</div>
          </div>
        </div>
      </div>
    </section>

    <!-- 批量导入密钥（隐藏输入） -->
    <input type="file" id="importFile" accept=".json" class="hidden" onchange="handleImportFile(event)" />
  </div>

  <div class="copy-toast" id="copyToast">已复制到剪贴板</div>

  <footer>
    MemBook License Generator · 离线 RSA-PKCS1-v1_5 + SHA-256
  </footer>

  <script>
    // 默认私钥由 generate-keypair.cjs 自动生成并嵌入，切勿手动修改。
    const DEFAULT_PRIVATE_KEY_JWK = {"kty":"RSA","n":"swoGY0xAXLlWYfsL15ZvSSI28kuUNaHWM14zf3zKDvlgj32cG_9PnlmQtA_whGvlmd1F6DjouHW_GTQnTVKpm626SGIcEYLpm6UcK5HqOmdM6CFFxJWq06Pgl-W1vahdc4bwibY6E72QG7AfXz9BXWEBlt8cIW1XHQVhWEyu4x4EB7sxXa8AIBxOv36YW1NIvprFT0NnbJ5BRRaPuebF9211rV-dXc7GPJbB9CM2XAcOdhM4-USEUD7g6R-CjRHsw2p0Yc4l7DblYsVo1abGMmDthNDPeYuR4_5y4bSCQzmwRcwm844UdpbrWi5B46oVxv4R9UlVvs0VRXuenir1Lw","e":"AQAB","d":"FnVyebBN_pOtN1tDkAap7RWiqOA8NkIX2Ze-hAaGXjyAFV_fXk-3kBiSI1RAiovyYEu2gjvpTYJPt3yoVXXCGuo_DOdpt_ShE0ox73E9XZgpuJC77L4NkMDk4okJNEJTfrN1pwC55lIIKsD8HnmT3H_XsDJKmBLcM6LCJE5yPcEHbMJSuL5UoeIU5RnOIBe6Wi0IJQ7sbwxUuN-jtS0D7xKnGrGLZ6mql6NC83KMQgRPaJxAr_RZ0jOJSR5u8GAvbDHafHI8eH_7IGu8IFSsGUm1BN5QeGQnQrmQtTpajQP4VL-6JZxpoM9AQFcZr66Uuo_AFyTltn2dx4AQtw6CeQ","p":"2u9_BK7UmzXo30WK8zZj3HCIylyxfW4Nr2JrnSTtgCXpTiONRi5srSarJe6RtRWGpefFUOg-WyIS9opJTCDAaRHFY4wL0DhcXBeI8zZEUH1qqjJ_ei4gZaGHUFmuddOeqB6L1gjZ60HHJJxUXZGS4DT1YROp0OEBwrLCaafY-d0","q":"0VlzFxHoNWOPvZmxR3qi7hE-CHWaniuBuS1sTrL4TdGPa-kW0FfsyVu9gRhMiiH0-4HD-q5_JVU9pmcw48i8xBw6RCzVpN44hxoCLg-2RlA7Gnq6C7B6mRDVgYuSVxEElbkzlUoJSiUu6ArxNvjt376sZ00mK_s-AHwu4JnMCHs","dp":"ntWF9yXHhNs1mVXgmtZo2HKkKvvYoMEJGKZ0oEs8Ku5WNqRASBxCJ9SX8isEdrWpPA_L7QiwxHkR_N8SkjJopVGJPNFLeMKK7xz79Eb4hNSYX-XG6iMwycrIWpjVoxHmVt3iYWOGhdDw4zSvWDrWreZ95vHXD31OQ6xgszpchdk","dq":"DLhQo-A0qbnI7A5AlUVATRLDICR1JpMiKKw33nhFWgUXn8jj1_jfrERkuUlOrT3u8rEpxTuBAjWxr0Cp2c1Cmu_UInxO5tuRt7O-2imeO5t4W92FHFy2tkItltdyJtQj4S0Fk1aSRe0IcpTnnx105plhRE2NujJjzAe_mWn-2a0","qi":"HIUPLCHJ9BKF-8UrhB0xAuuaw2LsWCHAAp8LllNRY8y1TZl_Vspd8BeOQFxR9zFJGON6FDqVRw1oVCvVRMfjqkMg-dRrmnLF-XPJcmvDeYkvz27kkKwuvwR7f3j1qXeaS0RSdBoh_xTqtvw5FsmPJ5MZOdrAJv4gW78mrhL9jRw"};

    const CODE_CHARS = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789'; // 排除 I/O/0/1
    const CODE_PARTS = 4;
    const PART_LENGTH = 4;
    const STORAGE_KEY = 'membook-license-generator-keys-v1';
    const RESULTS_KEY = 'membook-license-generator-results-v1';

    let currentPrivateJwk = null;
    let currentPublicJwk = null;
    let results = [];

    // ————————————————————————————————————
    // 初始化
    // ————————————————————————————————————
    async function init() {
      loadResults();
      renderResults();

      // 尝试从 localStorage 加载密钥，否则使用嵌入的默认私钥
      const stored = loadStoredKeys();
      if (stored && stored.privateKey) {
        await loadKeyPair(stored.privateKey, stored.publicKey);
      } else if (DEFAULT_PRIVATE_KEY_JWK && DEFAULT_PRIVATE_KEY_JWK.kty === 'RSA') {
        await loadKeyPair(DEFAULT_PRIVATE_KEY_JWK);
      } else {
        updateKeyStatus(false);
      }
    }

    // ————————————————————————————————————
    // 密钥操作
    // ————————————————————————————————————
    async function loadKeyPair(privateJwk, publicJwk) {
      try {
        currentPrivateJwk = privateJwk;
        currentPublicJwk = publicJwk || { kty: privateJwk.kty, n: privateJwk.n, e: privateJwk.e };
        // 验证私钥可导入
        await crypto.subtle.importKey(
          'jwk',
          currentPrivateJwk,
          { name: 'RSASSA-PKCS1-v1_5', hash: 'SHA-256' },
          true,
          ['sign'],
        );
        saveStoredKeys(currentPrivateJwk, currentPublicJwk);
        updateKeyStatus(true);
      } catch (err) {
        console.error(err);
        alert('加载密钥失败：' + err.message);
        updateKeyStatus(false);
      }
    }

    async function generateKeyPair() {
      if (!confirm('生成新密钥对后，旧激活码将全部失效。是否继续？')) return;
      try {
        const keyPair = await crypto.subtle.generateKey(
          { name: 'RSASSA-PKCS1-v1_5', modulusLength: 2048, publicExponent: new Uint8Array([1, 0, 1]), hash: 'SHA-256' },
          true,
          ['sign', 'verify'],
        );
        currentPrivateJwk = await crypto.subtle.exportKey('jwk', keyPair.privateKey);
        currentPublicJwk = await crypto.subtle.exportKey('jwk', keyPair.publicKey);
        saveStoredKeys(currentPrivateJwk, currentPublicJwk);
        updateKeyStatus(true);
        showToast('新密钥对已生成');
      } catch (err) {
        alert('生成密钥对失败：' + err.message);
      }
    }

    function updateKeyStatus(ok) {
      const badge = document.getElementById('keyStatusBadge');
      const thumb = document.getElementById('keyThumb');
      const publicOut = document.getElementById('publicKeyOut');
      const generateBtn = document.getElementById('generateBtn');

      if (ok && currentPublicJwk) {
        badge.className = 'badge badge-success';
        badge.textContent = '已加载密钥';
        thumb.classList.remove('hidden');
        thumb.textContent = 'n=' + currentPublicJwk.n.slice(0, 12) + '…';
        publicOut.value = JSON.stringify(currentPublicJwk, null, 2);
        generateBtn.disabled = false;
      } else {
        badge.className = 'badge badge-warning';
        badge.textContent = '未加载密钥';
        thumb.classList.add('hidden');
        publicOut.value = '';
        generateBtn.disabled = true;
      }
    }

    function saveStoredKeys(privateJwk, publicJwk) {
      try {
        localStorage.setItem(STORAGE_KEY, JSON.stringify({ privateKey: privateJwk, publicKey: publicJwk }));
      } catch {}
    }

    function loadStoredKeys() {
      try {
        const raw = localStorage.getItem(STORAGE_KEY);
        return raw ? JSON.parse(raw) : null;
      } catch { return null; }
    }

    async function exportKeys() {
      if (!currentPrivateJwk) return alert('请先生成或导入密钥对');
      const data = { privateKey: currentPrivateJwk, publicKey: currentPublicJwk, exportedAt: new Date().toISOString() };
      downloadJson(data, `membook-license-keys-${dateSuffix()}.json`);
    }

    function importKeys() {
      document.getElementById('importFile').click();
    }

    async function handleImportFile(event) {
      const file = event.target.files[0];
      if (!file) return;
      try {
        const text = await file.text();
        const data = JSON.parse(text);
        if (!data.privateKey || data.privateKey.kty !== 'RSA') {
          throw new Error('文件格式不正确，缺少 RSA 私钥');
        }
        await loadKeyPair(data.privateKey, data.publicKey);
        showToast('密钥对已导入');
      } catch (err) {
        alert('导入失败：' + err.message);
      }
      event.target.value = '';
    }

    function copyPublicKey() {
      const text = document.getElementById('publicKeyOut').value;
      if (!text) return;
      copyToClipboard(text);
    }

    // ————————————————————————————————————
    // 激活码生成
    // ————————————————————————————————————
    function generateRandomCode() {
      let code = 'MBK';
      for (let p = 0; p < CODE_PARTS; p++) {
        code += '-';
        for (let i = 0; i < PART_LENGTH; i++) {
          code += CODE_CHARS[Math.floor(Math.random() * CODE_CHARS.length)];
        }
      }
      return code;
    }

    async function signCode(code, machineId) {
      if (!currentPrivateJwk) throw new Error('未加载私钥');
      const privateKey = await crypto.subtle.importKey(
        'jwk',
        currentPrivateJwk,
        { name: 'RSASSA-PKCS1-v1_5', hash: 'SHA-256' },
        false,
        ['sign'],
      );
      const payload = machineId ? `${code}:${machineId}` : code;
      const data = new TextEncoder().encode(payload);
      const signature = await crypto.subtle.sign('RSASSA-PKCS1-v1_5', privateKey, data);
      return arrayBufferToBase64Url(signature);
    }

    async function generateCodes() {
      if (!currentPrivateJwk) return alert('请先生成或加载密钥对');
      const count = Math.min(100, Math.max(1, parseInt(document.getElementById('batchCount').value, 10) || 1));
      const machineId = document.getElementById('machineId').value.trim() || undefined;
      const added = [];
      for (let i = 0; i < count; i++) {
        const code = generateRandomCode();
        const signature = await signCode(code, machineId);
        added.push({ code, signature, machineId: machineId || null, createdAt: new Date().toISOString() });
      }
      results = added.concat(results);
      saveResults();
      renderResults();
      showToast(`已生成 ${count} 个激活码`);
    }

    // ————————————————————————————————————
    // 结果展示与导出
    // ————————————————————————————————————
    function renderResults() {
      const tbody = document.getElementById('resultsBody');
      const empty = document.getElementById('emptyState');
      const count = document.getElementById('resultsCount');
      count.textContent = `共 ${results.length} 条`;

      if (results.length === 0) {
        tbody.innerHTML = '';
        empty.classList.remove('hidden');
        return;
      }
      empty.classList.add('hidden');

      tbody.innerHTML = results.map((item, index) => `
        <tr>
          <td class="code-cell">${escapeHtml(item.code)}</td>
          <td class="mono">${escapeHtml(item.signature)}</td>
          <td>${item.machineId ? escapeHtml(item.machineId.slice(0, 8) + '…') : '<span style="color:var(--gray-400)">—</span>'}</td>
          <td>
            <div class="actions">
              <button class="icon-btn" title="复制激活码+签名" onclick="copyItem(${index})">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="13" height="13" rx="2" ry="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>
              </button>
              <button class="icon-btn" title="删除" onclick="deleteItem(${index})">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/></svg>
              </button>
            </div>
          </td>
        </tr>
      `).join('');
    }

    function copyItem(index) {
      const item = results[index];
      const text = `激活码：${item.code}\n签名：${item.signature}${item.machineId ? '\n绑定机器：' + item.machineId : ''}`;
      copyToClipboard(text);
    }

    function deleteItem(index) {
      if (!confirm('确定删除这条记录？')) return;
      results.splice(index, 1);
      saveResults();
      renderResults();
    }

    function clearResults() {
      if (!confirm('确定清空所有生成记录？')) return;
      results = [];
      saveResults();
      renderResults();
    }

    function saveResults() {
      try {
        localStorage.setItem(RESULTS_KEY, JSON.stringify(results));
      } catch {}
    }

    function loadResults() {
      try {
        const raw = localStorage.getItem(RESULTS_KEY);
        results = raw ? JSON.parse(raw) : [];
      } catch { results = []; }
    }

    function exportResults(format) {
      if (results.length === 0) return alert('没有可导出的记录');
      if (format === 'json') {
        downloadJson({ generatedAt: new Date().toISOString(), count: results.length, codes: results }, `membook-codes-${dateSuffix()}.json`);
      } else {
        const headers = ['激活码', '签名', '绑定机器', '生成时间'];
        const rows = results.map(r => [r.code, r.signature, r.machineId || '', r.createdAt]);
        const csv = [headers, ...rows].map(row => row.map(csvCell).join(',')).join('\n');
        downloadText(csv, `membook-codes-${dateSuffix()}.csv`, 'text/csv');
      }
    }

    // ————————————————————————————————————
    // 工具函数
    // ————————————————————————————————————
    function arrayBufferToBase64Url(buffer) {
      const bytes = new Uint8Array(buffer);
      let binary = '';
      for (let i = 0; i < bytes.byteLength; i++) binary += String.fromCharCode(bytes[i]);
      return btoa(binary).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '');
    }

    function escapeHtml(text) {
      const div = document.createElement('div');
      div.textContent = text;
      return div.innerHTML;
    }

    function csvCell(value) {
      const str = String(value ?? '');
      if (/[",\n]/.test(str)) return '"' + str.replace(/"/g, '""') + '"';
      return str;
    }

    function dateSuffix() {
      const d = new Date();
      return `${d.getFullYear()}${pad(d.getMonth() + 1)}${pad(d.getDate())}_${pad(d.getHours())}${pad(d.getMinutes())}`;
    }

    function pad(n) { return String(n).padStart(2, '0'); }

    function downloadJson(data, filename) {
      downloadText(JSON.stringify(data, null, 2), filename, 'application/json');
    }

    function downloadText(text, filename, type) {
      const blob = new Blob([text], { type });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = filename;
      a.click();
      URL.revokeObjectURL(url);
    }

    async function copyToClipboard(text) {
      try {
        await navigator.clipboard.writeText(text);
        showToast('已复制到剪贴板');
      } catch {
        const ta = document.createElement('textarea');
        ta.value = text;
        document.body.appendChild(ta);
        ta.select();
        document.execCommand('copy');
        document.body.removeChild(ta);
        showToast('已复制到剪贴板');
      }
    }

    function showToast(message) {
      const toast = document.getElementById('copyToast');
      toast.textContent = message;
      toast.classList.add('show');
      setTimeout(() => toast.classList.remove('show'), 2000);
    }

    // 启动
    init();
  </script>
</body>
</html>
